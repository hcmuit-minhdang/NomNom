<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Đã đăng nhập</title>
    <link rel="stylesheet" href="style.css">
    <script src="header.js" defer></script>
</head>

<body>
    <header data-nomnom-header>
        <div class="container">
            <div class="Logo-box">
                <a href="../../Thach/Home-page/index.html" data-header-route="home" aria-label="NomNom — Trang chủ"><img class="logo" src="../assets/images/logo.png" alt="NomNom"></a>
            </div>
            <div class="Control">
                <div class="three-button">
                    <div class="box-button">
                        <details>

                            <summary>Công thức <img class="arrow-list" src="../assets/SVG/keyboard_arrow_up.svg"
                                    alt="Arrow List">
                            </summary>

                            <ul>
                                <li><a href="../../Phat/index.html" data-header-route="search">Tìm công thức</a></li>
                                <li><button type="button" data-header-action="ingredients">Danh mục nguyên liệu</button></li>
                                <li><button type="button" data-header-action="random">Gợi ý bất ngờ</button></li>
                                <li><button type="button" data-header-action="collections">Tuyển tập công thức</button></li>
                            </ul>
                        </details>
                    </div>
                    <div class="box-button">
                        <details>
                            <summary>Về chúng tôi <img class="arrow-list" src="../assets/SVG/keyboard_arrow_up.svg"
                                    alt="Arrow List">
                            </summary>

                            <ul>
                                <li><a href="../../Minh/aboutus/index.html" data-header-route="about">Về NomNom</a></li>
                                <li><button type="button" data-header-action="guide"><b>Hướng dẫn</b></button></li>
                                <li><button type="button" data-header-action="faq"><b>Câu hỏi thường gặp</b></button></li>
                                <li><button type="button" data-header-action="contact">Liên hệ</button></li>
                            </ul>
                        </details>
                    </div>
                    <div class="box-button" id="DanhMuc"><a href="../../Phat/index.html" data-header-route="categories">Danh mục</a></div>
                    <div class="box-button" data-header-member>
                        <details>
                            <summary>Góc của tôi<img class="arrow-list" src="../assets/SVG/keyboard_arrow_up.svg"
                                    alt="Arrow List">
                            </summary>

                            <ul>
                                <li><a href="../../Minh/user/overview.html" data-header-route="overview">Tổng quan</a></li>
                                <li><a href="../../Minh/user/uploaded.html" data-header-route="uploaded">Công thức đã đăng tải</a></li>
                                <li><a href="../../Minh/user/saved.html" data-header-route="saved">Công thức đã lưu</a></li>
                                <li><a href="../../Minh/user/history.html" data-header-route="history">Lịch sử</a></li>
                                <li><a href="../../Minh/user/index.html" data-header-route="account">Tài khoản của tôi</a></li>
                                <li><button type="button" data-auth-action="logout"><b>Đăng xuất</b></button></li>
                            </ul>
                        </details>
                    </div>
                </div>
                <div class="two-three-button">
                    <div class="two-button" data-header-guest hidden>
                        <button id="sign-butt" type="button" data-auth-action="signup">Đăng ký</button>
                        <button id="log-butt" type="button" data-auth-action="login">Đăng nhập</button>
                    </div>
                    <details class="search-bar-butt">
                        <summary aria-controls="search-bar" aria-label="Mở tìm kiếm">
                            <img class="Search-icon search-open-icon" src="../assets/SVG/Search_Com.svg"
                                alt="Mở thanh tìm kiếm">
                            <img class="search-close-icon" src="../assets/SVG/X.svg" alt="Đóng thanh tìm kiếm">
                        </summary>
                        <div id="search-bar">
                            <form class="search-field" role="search" aria-label="Tìm công thức" action="../../Phat/index.html" method="get">
                                <input type="search" name="q" placeholder="Tìm kiếm ..." aria-label="Từ khóa tìm kiếm" required>
                                <button class="search-submit" type="submit" aria-label="Tìm kiếm">
                                    <img src="../assets/SVG/Search_input.svg" alt="">
                                </button>
                            </form>
                        </div>
                    </details>
                </div>
            </div>
        </div>
        <p class="header-status" role="status" aria-live="polite" hidden></p>
    </header>
</body>

</html>
